cathode_electrolyte-reactions:
- beta: 0.5
  equation: Li+[elyt] + V[cathode] + electron <=> Li[cathode]
  exchange-current-density-formulation: true
  id: cathode_reaction
  rate-constant:
    A: 4.05e-05
    Ea: 0.0 kJ/mol
    b: 0.0
cell-description:
  anode:
    A_surf_ratio: 1.0
    C_dl: 9e-6
    bulk-phase: lithium_metal
    class: dense_electrode
    conductor-phase: electron
    dy_elyte: 2e-6
    electrolyte-phase: electrolyte
    minimum-thickness: 1e-9
    mobile-ion: Li+[elyt]
    phi_0: 0.0
    stored-ion:
      charge: 1
      name: Li[metal]
    surf-phase: lithium_electrolyte
    thickness: 50e-6
  cathode:
    C_dl: 9e-3
    X_0: Li[cathode]:0.001, V[cathode]:0.999
    bulk-phase: cathode
    class: mpm
    conductor-phase: electron
    delta_r: 1e-8
    diffusion-coefficients:
    - D_k: 4.23e-17
      species: Li[cathode]
    - D_k: 4.23e-17
      species: V[cathode]
    electrolyte-phase: electrolyte
    eps_solid:
    - 0.65
    - 0.65
    - 0.65
    mobile-ion: Li+[elyt]
    n_radii: 5
    phi_0: 3.4
    r_p:
    - 5.0e-06
    - 6.0e-08
    - 7.0e-08
    radial-method: delta_r
    stored-ion:
      charge: 1
      name: Li[cathode]
    surf-phase: cathode_electrolyte
    thickness: 100e-6
  separator:
    class: porous_separator
    electrolyte-phase: electrolyte
    eps_electrolyte: 0.65
    n_points: 4
    phi_0: 2.96
    sigma_io: 1.3
    thickness: 20e-6
    transport:
      D_scale_coeff: 1e-11
      diffusion-coefficients:
      - D_k: 1e-15
        species: C3H4O3[elyt]
      - D_k: 1e-15
        species: C4H6O3[elyt]
      - D_k: 2e-11
        species: Li+[elyt]
      - D_k: 2e-13
        species: PF6-[elyt]
      mobile-ion: Li+[elyt]
      model: dilute-solution
description: "Cantera input file for an LFP/Li metal lithium-ion battery\n\nThis file\
  \ includes a full set of thermodynamic and kinetic parameters of a\nlithium-ion\
  \ battery, in particular:\n- Active materials: LiCoO2 (LCO) and Li (li metal)\n\
  - Organic electrolyte: EC/PC with 1M LiPF6\n- Interfaces: LCO/electrolyte and Li/electrolyte\n\
  - Charge-transfer reactions at the two interfaces\n\nReference:\nFor the electrolyte\
  \ and LCO:\nM. Mayur, S. C. DeCaluwe, B. L. Kee, W. G. Bessler, \u201CModeling and\
  \ simulation\nof the thermodynamics of lithium-ion battery intercalation materials\
  \ in the\nopen-source software Cantera,\u201D Electrochim. Acta 323, 134797 (2019),\n\
  https://doi.org/10.1016/j.electacta.2019.134797\n\nBulk phases\n===========\n\n\
  Lithium (anode)\n\n\nCarbonate based electrolyte (electrolyte)\nSolvent: Ethylene\
  \ carbonate:Propylene carbonate (1:1 v/v)\nSalt: 1M LiPF6\n\nInterface phases\n\
  ================\n\nlithium/electrolyte interface (lithium_electrolyte)\nSpecies\
  \ and site density are dummy entries (as we do not consider surface-\nadsorbed species)\n\
  \nLCO/electrolyte interface (cathode_electrolyte)\nSpecies and site density are\
  \ dummy entries (as we do not consider surface-\nadsorbed species)"
lithium_electrolyte-reactions:
- beta: 0.5
  equation: Li[metal] <=> Li+[elyt] + electron
  id: lithium_faradaic_reaction
  rate-constant:
    A: 6000000000000.0
    Ea: 0.0
    b: 0.0
parameters:
  P: 101325 Pa
  T: 60 C
  outputs:
    show-plots: true
  simulations:
  - C-rate: 0.0001
    equilibrate:
      enable: true
      time: 10
    first-step: discharge
    i_ext: null
    n_cycles: 3
    outputs:
      save-name: data_file_0
      show-plots: true
    phi-cutoff-lower: 2.8
    phi-cutoff-upper: 4.2
    species-cutoff: 1e-12
    species-default:
      C3H4O3[elyt]: 0.47901
      C4H6O3[elyt]: 0.37563
      Li+[elyt]: 1.0e-12
      PF6-[elyt]: 0.07268
    type: CC_cycle
phases:
- density: 0.534 g/cm^3
  name: lithium_metal
  species:
  - Li[metal]
  state:
    P: 1 atm
    T: 300.0
  thermo: ideal-condensed
- elements:
  - Li
  - Fe
  - P
  - O
  name: cathode
  species:
  - Li[cathode]
  - V[cathode]
  standard-concentration-basis: unity
  state:
    P: 1 atm
    T: 300.0 K
    X:
      Li[cathode]: 0.5
      V[cathode]: 0.5
  thermo: ideal-condensed
- elements:
  - Li
  - P
  - F
  - C
  - H
  - O
  - E
  name: electrolyte
  species:
  - C3H4O3[elyt]
  - C4H6O3[elyt]
  - Li+[elyt]
  - PF6-[elyt]
  standard-concentration-basis: unity
  state:
    X:
      C3H4O3[elyt]: 0.47901
      C4H6O3[elyt]: 0.37563
      Li+[elyt]: 0.07268
      PF6-[elyt]: 0.07268
  thermo: ideal-condensed
- density: 1.0 kg/m^3
  elements:
  - E
  name: electron
  species:
  - electron
  state:
    X:
      electron: 1.0
  thermo: electron-cloud
- kinetics: surface
  name: lithium_electrolyte
  reactions:
  - lithium_electrolyte-reactions
  site-density: 0.01 mol/cm^2
  species:
  - (dummy)
  thermo: ideal-surface
- kinetics: surface
  name: cathode_electrolyte
  reactions:
  - cathode_electrolyte-reactions
  site-density: 0.01 mol/cm^2
  species:
  - (dummy)
  thermo: ideal-surface
species:
- composition:
    Li: 1
  equation-of-state:
    model: constant-volume
    molar-volume: 12.998 cm^3/mol
  name: Li[metal]
  thermo:
    h0: 19.50 kJ/mol
    model: constant-cp
    s0: 29.1 J/mol/K
- composition:
    Fe: 1
    Li: 1
    O: 4
    P: 1
  equation-of-state:
    model: constant-volume
    molar-volume: 45.33 cm^3/mol
  name: Li[cathode]
  note: 'Lithium Iron oxide, MW: 157.757 g/mol.

    Note this species includes the iron phosphate host matrix.

    Density of LFP: 3.48 g/cm3 https://cdn.intechopen.com/pdfs/18671/InTech-Lifepo4_cathode_material.pdf
    (used to calculate species molar volume as molecular weight/density).'
  thermo:
    h0: -326.65 kJ/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition:
    Fe: 1
    O: 4
    P: 1
  equation-of-state:
    model: constant-volume
    molar-volume: 45.33 cm^3/mol
  name: V[cathode]
  note: 'Vacancy in the LFP, MW: 90.9320 g/mol.

    Molar enthalpy and entropy are set to 0 because this is the reference species
    for this phase.

    Molar volume assumed constant: no expansion or contraction, upon lithiation/delithiation.'
  thermo:
    h0: 0.0 kJ/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition:
    C: 3
    H: 4
    O: 3
  equation-of-state:
    model: constant-volume
    molar-volume: 69.89126984126985 cm^3/mol
  name: C3H4O3[elyt]
  note: 'Ethylene carbonate, MW: 88.0630 g/mol

    Density of electrolyte: 1260 kg/m3 (used to calculate species molar volume

    as molecular weight (MW)/density)

    Molar enthalpy and entropy set to zero (dummy entries as this species does

    not participate in chemical reactions)'
  thermo:
    h0: 0.0 J/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition:
    C: 4
    H: 6
    O: 3
  equation-of-state:
    model: constant-volume
    molar-volume: 81.02365079365079 cm^3/mol
  name: C4H6O3[elyt]
  note: 'Propylene carbonate, MW: 102.0898 g/mol

    Density of electrolyte: 1260.0 kg/m3 (used to calculate species molar volume

    as molecular weight (MW)/density)

    Molar enthalpy and entropy set to zero (dummy entries as this species does

    not participate in chemical reactions)'
  thermo:
    h0: 0.0 J/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition:
    E: -1
    Li: 1
  equation-of-state:
    model: constant-volume
    molar-volume: 5.508297619047619 cm^3/mol
  name: Li+[elyt]
  note: 'Lithium ion, MW: 6.940455 g/mol

    Density of electrolyte: 1260.0 kg/m3 (used to calculate species molar volume

    as molecular weight (MW)/density)

    Molar enthalpy and entropy taken from Li+(aq) from P. Atkins "Physical

    Chemistry", Wiley-VCH (2006)'
  thermo:
    h0: -278.49 kJ/mol
    model: constant-cp
    s0: 13.4 J/mol/K
- composition:
    E: 1
    F: 6
    P: 1
  equation-of-state:
    model: constant-volume
    molar-volume: 115.05138492063492 cm^3/mol
  name: PF6-[elyt]
  note: 'Hexafluorophosphate ion, MW: 144.964745 g/mol

    Density of electrolyte: 1260.0 kg/m3 (used to calculate species molar volume

    as molecular weight (MW)/density)

    Molar enthalpy and entropy set to zero (dummy entries as this species does

    not participate in chemical reactions)'
  thermo:
    h0: 0.0 J/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition:
    E: 1
  name: electron
  note: 'Electron, MW: 0.000545 g/mol

    Molar enthalpy and entropy set to zero (dummy entries because chemical

    potential is set to zero for a "metal" phase)'
  thermo:
    h0: 0.0 kJ/mol
    model: constant-cp
    s0: 0.0 J/mol/K
- composition: {}
  name: (dummy)
  note: Dummy species (needed for defining the interfaces)
  thermo:
    h0: 0.0 kJ/mol
    model: constant-cp
    s0: 0.0 J/mol/K
